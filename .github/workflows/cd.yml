name: Continuous Deployment

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: |
          npm install
      - name: Lint and build
        run: |
          npm run lint
          npm run rollup
          npm run babel
      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> $GITHUB_ENV
      - name: Set the release body
        id: release
        shell: bash
        run: |
          {
            echo 'RELEASE_BODY<<RELEASE_BODY_EOF'
            cat "release_notes/v${RELEASE_VERSION}.md"
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Upload the release file
        uses: svenstaro/upload-release-action@2.11.5
        with:
          file: dist/*
          file_glob: true
          overwrite: true
          # tags like v2.8.0-beta.1 become GitHub pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          promote: false
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ${{ steps.release.outputs.RELEASE_BODY }}
