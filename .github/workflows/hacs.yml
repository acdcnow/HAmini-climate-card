name: Hacs Validation

on:
  push:
    branches: ['*']
  schedule:
    - cron: '0 4 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # NOTE: the plugin structure check resolves `filename` from the release
          # assets. HACS skips pre-releases (hacs/repositories/base.py:
          # `if release.draft or (release.prerelease and not prerelease)`), so
          # this job can only pass once a *non* pre-release exists.
