name: Hacs Validation

on:
  push:
    branches: ['*']
  schedule:
    - cron: '0 4 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
